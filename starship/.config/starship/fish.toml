"$schema" = 'https://starship.rs/config-schema.json'

# Insert a blank line between shell prompts
add_newline = false


format = """\
[┌─](fg:235) $directory$git_branch$git_status$git_state$git_metrics $fill $all\
[└─](fg:235) $jobs$character"""


right_format="[ $container$username$localip$time ](bg:233)"

# [profiles]
# transient = """[$time](fg:white) $character"""

[fill]
symbol = "—"
style = 'fg:235'

[line_break]
disabled = false

[character]
format = '$symbol '
success_symbol = "[I ](bold green)"
vimcmd_symbol = "[N ](bold fg:246)"
vimcmd_visual_symbol = "[V ](bold fg:244)"
error_symbol = "[I](bold green) [](bold red)"

[jobs]
symbol = ""

[time]
disabled = false
format = "[  $time]($style)"
time_format = "%l:%M %p"
style = "none"
use_12hr = true
utc_time_offset = "local"

[directory]
truncate_to_repo = true
repo_root_style = "cyan bold"
style = "bold cyan dimmed"
format = "  [$path ]($style)"
repo_root_format = '  [$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = " "
style = "bold fg:213"
format = "[|](fg:235)[ $symbol$branch(:$remote_branch)]($style) "

[git_metrics]
disabled = false

[php]
symbol = " "

[nodejs]
format = '[$symbol($version)]($style) '
version_format = "${major}.${minor}"

[python]
format = '[$symbol($version)]($style)( \($virtualenv\)) '
version_format = "${major}.${minor}"
symbol = ' '

[golang]
format = '[$symbol($version)]($style) '
version_format = "${major}.${minor}"
symbol = ' '

[package]
format = '[$symbol($version)]($style) '
symbol = ' '

[lua]
format = '[$symbol($version)]($style)'
symbol = ' '

[docker_context]
disabled = true

[localip]
disabled = false
ssh_only = true
style = "bold fg:yellow bg:233"

[hostname]
disabled = true

[username]
style_root = "bold fg:red bg:233"
style_user = "bold fg:yellow bg:233"

[container]
style = "bold dimmed fg:red bg:233"
