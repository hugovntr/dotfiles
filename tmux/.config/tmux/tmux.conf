# Leader
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Force use of zsh
# set-option -g default-shell /bin/zsh
# Force use of fish
set-option -g default-shell /opt/homebrew/bin/fish

# Copy Mode
set-option -g mode-keys vi
bind ^ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind -T copy-mode-vi j send-keys -X cursor-left
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi l send-keys -X cursor-down
bind -T copy-mode-vi m send-keys -X cursor-right
bind -T copy-mode-vi ø send-keys -X previous-paragraph
bind -T copy-mode-vi È send-keys -X previous-paragraph
bind -T copy-mode-vi ¬ send-keys -X next-paragraph
bind -T copy-mode-vi Escape send-keys -X cancel

# Termcolor
set -g default-terminal "xterm-256color"
set -as terminal-overrides ",xterm*:Tc"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256color:RGBA"

# Passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Disable unnecessary redraws
set-option -g focus-events on
set-option -g escape-time 0

# Split panes
unbind %
unbind d
# bind d split-window -v

unbind h
# bind h split-window -h

# Kill pane
unbind x
unbind z
bind x kill-pane
bind z kill-pane

# Refresh tmux config
unbind r
#bind r source-file "~/.config/tmux/tmux.conf"
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "Reloaded"


bind f split-window -c "#{pane_current_path}"
bind d split-window -h -c "#{pane_current_path}"

bind -r j resize-pane -L 5
bind -r k resize-pane -U 5
bind -r l resize-pane -D 5
bind -r m resize-pane -R 5


# Maximize pane
unbind ù
bind -r ù resize-pane -Z

# Enable mouse
set -g mouse on

# Load the theme
run-shell "~/.config/tmux/theme.tmux"

# Restore last session
set -gu status-right
set -g @resurrect-save 't'
set -g @resurrect-restore 'y'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'python sqlite3 "~nvim" "~make" neovim "~just"'
#set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g status-right '󰆓 Saving every #{continuum_status} mins '
set-option -g status-interval 30
# set -g status-right '💾#{continuum_status}#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sunaku/tmux-navigate'
# set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Navigation keymap
set -g @navigate-left '-n C-j'
set -g @navigate-up '-n C-k'
set -g @navigate-down '-n C-l'
set -g @navigate-right '-n C-h'

# Clear screen
bind -n C-g send-keys C-l

# Keep at the very end
run "~/.config/tmux/plugins/tpm/tpm"

